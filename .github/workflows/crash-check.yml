# Runs a released APK on an Android emulator, taps through it like a person and prints any crash
# from the phone's log. Started by hand: Actions > Crash check > Run workflow (or gh workflow run).
name: Crash check

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test, e.g. v3.4"
        required: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Download the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}" -p '*.apk' -D apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: false
          script: bash .github/scripts/crash-check.sh

      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-check
          path: out/
