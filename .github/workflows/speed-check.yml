# Compares how smoothly releases scroll on the same emulator (frame times from dumpsys gfxinfo).
# Started by hand: gh workflow run speed-check.yml -f tags="v3.0 v3.4.2"
name: Speed check

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Release tags to compare, space-separated"
        required: true
        default: "v3.0 v3.4.2"

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download the APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: for t in ${{ inputs.tags }}; do gh release download "$t" -p '*.apk' -D "apk/$t"; done

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Measure on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: false
          script: bash .github/scripts/speed-check.sh "${{ inputs.tags }}"
