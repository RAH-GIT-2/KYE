# Compares how smoothly versions scroll with ~1,500 entries loaded (frame times from dumpsys
# gfxinfo on an emulator). Each version is built as a "benchmark" APK: like the release, plus a
# screen that loads made-up entries. Started by hand:
#   gh workflow run speed-check.yml -f refs="v3.0 main"
name: Speed check

on:
  workflow_dispatch:
    inputs:
      refs:
        description: "Git tags/branches to compare, space-separated"
        required: true
        default: "v3.0 main"

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build benchmark APKs
        run: |
          for r in ${{ inputs.refs }}; do
            n=$(echo "$r" | tr '/' '_')
            git worktree add --detach "/tmp/w-$n" "$r"
            bash .github/scripts/add-benchmark.sh "/tmp/w-$n"
            (cd "/tmp/w-$n" && chmod +x gradlew && ./gradlew assembleBenchmark --console=plain -q)
            mkdir -p "apk/$n"
            cp /tmp/w-$n/app/build/outputs/apk/benchmark/*.apk "apk/$n/"
          done
          ls -R apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Measure on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: false
          script: bash .github/scripts/speed-check.sh "${{ inputs.refs }}"
